# Local dev stack: redis + api + 2 workers. The pallet_packer core is mounted
# read-only from the parent dir (D10 dev mode). `docker compose up --build`.
services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    command: uvicorn pallet_api.api.app:app --host 0.0.0.0 --port 8000
    environment:
      PALLET_API_REDIS_URL: "redis://redis:6379"
      PALLET_API_SOFT_BUDGET_S: "90"
      PALLET_API_HARD_BUDGET_S: "120"
      PALLET_API_MAX_BOXES: "500"
      PALLET_API_CORE_VERSION: "dev-mount"   # prod: set to the pinned core git ref
    ports: ["8000:8000"]
    volumes:
      - "..:/core:ro"        # the pallet_packer core repo (dev mount, D10)
    depends_on: [redis]

  worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    command: arq pallet_api.workers.settings.WorkerSettings
    environment:
      PALLET_API_REDIS_URL: "redis://redis:6379"
      PALLET_API_SOFT_BUDGET_S: "90"
      PALLET_API_HARD_BUDGET_S: "120"
      OMP_NUM_THREADS: "2"
    volumes:
      - "..:/core:ro"
    depends_on: [redis]
    deploy:
      replicas: 2            # 2 workers = 2 concurrent solves (D4)
