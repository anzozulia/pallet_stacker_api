# Standalone stack: redis + api + 4 workers. The pallet_packer core is vendored
# (core/) and built into the image — no host mount, no external dependency.
#   docker compose up --build
services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    command: uvicorn pallet_api.api.app:app --host 0.0.0.0 --port 8000
    environment:
      PALLET_API_REDIS_URL: "redis://redis:6379"
      PALLET_API_SOFT_BUDGET_S: "90"
      PALLET_API_HARD_BUDGET_S: "120"
      PALLET_API_MAX_BOXES: "500"
      PALLET_API_CORE_VERSION: "3.13.0+fd2ea2c"   # vendored core (see core/VENDOR.md)
    ports: ["8000:8000"]
    depends_on: [redis]

  worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    command: arq pallet_api.workers.settings.WorkerSettings
    environment:
      PALLET_API_REDIS_URL: "redis://redis:6379"
      PALLET_API_SOFT_BUDGET_S: "90"
      PALLET_API_HARD_BUDGET_S: "120"
      OMP_NUM_THREADS: "2"
    depends_on: [redis]
    deploy:
      # 4 workers x OMP=2 = 4 concurrent solves on 8 of ~10 cores (D4). This is the
      # Phase 6 load-test recommendation (docs/05_load_profile.md): OMP=2, workers
      # ~= cores/2, ~2 cores headroom for api+redis. Reduce on smaller hosts so
      # total worker-threads stay <= cores.
      replicas: 4
