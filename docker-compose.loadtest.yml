# Load-test stack (Phase 6). Self-contained — NOT an override. Worker count is set
# via `--scale worker=N`; OMP threads + budgets via host env (LT_OMP/LT_SOFT/LT_HARD).
# Rate limiting is disabled so the limiter never distorts throughput numbers.
#   LT_OMP=2 docker compose -f docker-compose.loadtest.yml up -d --build --scale worker=4
services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    command: uvicorn pallet_api.api.app:app --host 0.0.0.0 --port 8000
    environment:
      PALLET_API_REDIS_URL: "redis://redis:6379"
      PALLET_API_SOFT_BUDGET_S: "${LT_SOFT:-90}"
      PALLET_API_HARD_BUDGET_S: "${LT_HARD:-120}"
      PALLET_API_MAX_BOXES: "500"
      PALLET_API_RATE_LIMIT_PER_MIN: "1000000"   # effectively off for load testing
      PALLET_API_CORE_VERSION: "loadtest"
    ports: ["8000:8000"]
    volumes:
      - "..:/core:ro"
    depends_on: [redis]

  worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    command: arq pallet_api.workers.settings.WorkerSettings
    environment:
      PALLET_API_REDIS_URL: "redis://redis:6379"
      PALLET_API_SOFT_BUDGET_S: "${LT_SOFT:-90}"
      PALLET_API_HARD_BUDGET_S: "${LT_HARD:-120}"
      OMP_NUM_THREADS: "${LT_OMP:-2}"
    volumes:
      - "..:/core:ro"
    depends_on: [redis]
